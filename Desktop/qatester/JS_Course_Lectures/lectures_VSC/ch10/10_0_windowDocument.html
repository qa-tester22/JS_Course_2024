        <script>
            //Извлечение аргументов из URL-адреса
            /**
             * Эта функция выделяет в URL-адресе разделенные амперсандами пары аргументов 
             * name=value из строки запроса. Они сохраняет эти пары в свойствах объекта и возвращает этот объект. Порядок использования:
             * let args = getArgs();  // Извлечь аргументы из URL
             * let q = args.q || "";  // Использовать аргумент, если определен,
             *      // или значение по умолчанию
             * let n = args.n ? parseInt(args.n) : 10; 
             */ 

             function getArgs() {
                let args = new Object();
                let query = location.search.substring(1);  // Получить строку запроса
                let pairs = query.split("&");  // Разбить по амперсандам
                for(let i = 0; i < pairs.length; i++) {
                    let pos = pairs[i].indexOf('=');  // Отыскать пару "name=value"
                    if (pos == -1) continue;  // не найдено - пропустить
                    let argname = pairs[i].substring(0, pos);  // Извлечь имя
                    let value = pairs[i].substring(pos + 1);  // Извлечь значение 
                    value = decodeURIComponent(value);  // Преобразовать, если нужно
                    args[argname] = value;  // Сохранить в виде свойства 
                }
                return args;   // Вернуть объект
             }

             document.write(getArgs());
             console.log(getArgs());
        </script>
